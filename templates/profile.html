{% extends "base.html" %}
{% block title %}My Profile{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <img src="{{ profile.profile_picture.url }}" alt="Profile picture"
                         class="rounded-circle mb-2" style="width: 96px; height: 96px; object-fit: cover;">
                    <h4 class="mb-0">{{ user.full_name }}</h4>
                    <span class="badge text-bg-secondary text-uppercase">{{ user.role }}</span>
                </div>

                <form method="post" enctype="multipart/form-data" novalidate>
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" value="{{ user.email }}" disabled>
                        <div class="form-text">Email can't be changed here.</div>
                    </div>

                    <div class="mb-3">
                        <label for="phone_number" class="form-label">Phone Number</label>
                        <input type="text" id="phone_number" name="phone_number" class="form-control"
                               value="{{ user.phone_number }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="profile_picture" class="form-label">Profile Picture</label>
                        <input type="file" id="profile_picture" name="profile_picture" class="form-control" accept="image/*">
                        <div class="form-text">Leave blank to keep your current photo.</div>
                    </div>

                    <div class="mb-3">
                        <label for="bio" class="form-label">Bio</label>
                        <textarea id="bio" name="bio" class="form-control" rows="3"
                                  placeholder="A short introduction other users will see.">{{ profile.bio }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label for="skills" class="form-label">Skills</label>
                        <input type="text" id="skills" name="skills" class="form-control"
                               value="{{ profile.skills }}" placeholder="e.g. Plumbing, Electrical, Web Development">
                        <div class="form-text">Comma-separated list of skills or specialties.</div>
                    </div>

                    <div class="mb-4">
                        <label for="address" class="form-label">Address</label>
                        <textarea id="address" name="address" class="form-control" rows="2"
                                  placeholder="Your default address for deliveries or job locations.">{{ profile.address }}</textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Save Changes</button>
                </form>
            </div>
        </div>

        <div class="mt-3">
            <a href="{% url 'role_dispatch' %}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> Back to dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
